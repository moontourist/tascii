<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>tascii</title>
<link rel="stylesheet" href="panel.css">
<header><h1>tascii</h1><time id="today"></time></header>
<div id="progress" hidden><span aria-hidden="true">[<span id="fill"></span><span id="rest"></span>]</span><span id="tally"></span></div>
<div class="rule" aria-hidden="true"></div>
<label class="prompt"><span aria-hidden="true">&gt;</span><input id="new" placeholder="add a task" autocomplete="off" maxlength="500" aria-label="New task" autofocus></label>
<div class="rule" aria-hidden="true"></div>
<ul id="list"></ul>
<p id="empty" hidden>nothing to do.</p>
<details id="history" hidden><summary>history (<span id="count">0</span>)</summary><ul id="done"></ul></details>
<footer aria-hidden="true">j/k move · spc done · l⏎ del · i add</footer>
<template id="row"><li><button class="task"><span class="box" aria-hidden="true"></span><span class="text"><span class="label"></span></span><span class="when"></span></button><button class="del" aria-label="Delete">x</button></li></template>
<script src="panel.js"></script>
